<!DOCTYPE html>
<html>
  <head>
    <title>Cart Quantity</title>
    <style>
      .button{
        padding:3px 5px;
        border-radius:3px;
        margin-left:4px;
        transition-duration: 0.15s;
        border:1px solid grey
      }

      .button:hover{
        background-color: #d8d8d8;
      }
    </style>
  </head>
  <body style="font-family:Arial">
      
    <h3>Cart Quantity</h3>

    <button class="button" onclick="
      console.log('Cart Quantity: ' + cart)">
        Show Quantity
    </button>

    <button class="button" onclick="
      cart = cart + 1; 
      console.log('Cart Quantity: ' + cart)">
        Add To Cart
    </button>

    <button class="button" onclick="
      cart+=2;
      console.log('Cart Quantity: ' + cart)">
        +2 
      </button>

    <button class="button" onclick="
    cart+=3;
    console.log('Cart Quantity: ' + cart)">
        +3 
    </button>

    <button class="button" onclick="
    cart = 0;
    console.log('Cart Quantity: ' + cart)">
       Reset Cart
    </button>

    <script>
      let cart = 0;
    </script>

  </body>
</html>
