<!DOCTYPE html>
<html>
  <head>
    <title>variables</title>
  </head>
  <body style="font-family:Arial">
    <script>

      const message = 'Hello'
      console.log(message);

      let variable1 = 3;
      console.log(variable1);
      console.log(variable1 + 67/10)
      //let variables can be changed

      variable1 = 5;
      console.log(variable1);

      variable1 = variable1 + 1;
      console.log(variable1);
      
      const variable2 = 2+2/4*5;
      console.log(variable2)
      console.log(variable2 + 2);
      //const ant be changed 

      var variable3 = 3;
      //var is not used in new javascript code

      console.log(typeof message);
      console.log(typeof variable1);

    </script>
  </body>
</html>
