<!DOCTYPE html>
<html>
  <head>
    <title>Rock Paper Scissors</title>
    <style>
    .body {
      font-family:Arial
    }

    .rock, .paper, .scissors {
      height:130px;
      width:130px;
      border-radius:65px;
      border:1px solid grey;
      margin-right:10px;
      cursor:pointer;
    }

    .rock:active, .paper:active, .scissors:active{
      background-color: #e7e7e7;
    }
  </style>
  </head>
  
  <body class = "body">
    <p class="header">Rock Paper Scissors</p>
    <button class="rock" onclick="
      const randomNum = Math.random();
      if (randomNum >=0 && randomNum <= 1/3) {
        console.log('Scissors, U won');
        win += 1;
      } else if (randomNum >=1/3 && randomNum <= 2/3) {
        console.log('Paper, U lose') ;
        lose += 1;
      } else {
        console.log('Tie');
        tie += 1;
      }
    ">rock</button>

    <button class="paper" onclick="
      const randomNum1 = Math.random();
      if (randomNum1 >=0 && randomNum1 <= 1/3) {
        console.log('Rock,U won')
        win += 1;
      } else if (randomNum1 >=1/3 && randomNum1 <= 2/3) {
        console.log('Scissor, U lose');
        lose += 1;
      } else {
        console.log('Tie');
        tie += 1;
      }
    ">paper</button>

    <button class="scissors" onclick="
      const randomNum2 = Math.random();
      if (randomNum2 >=0 && randomNum2 <= 1/3) {
        console.log('Paper,U won');
        win += 1;
      } else if (randomNum2 >=1/3 && randomNum2 <= 2/3) {
        console.log('Rock, U lose');
        lose += 1;
      } else {
        console.log('Tie');
        tie += 1;
      }
    ">scissors</button>

    <button onclick="
      console.log('won: '+ win + '  ,lose: ' + lose + '  ,tie: ' + tie);
    ">check</button>

    <button onclick="
      win = 0;
      lose = 0;
      tie = 0;
      console.log('won: '+ win + '  ,lose: ' + lose + '  ,tie: ' + tie);
    ">reset</button>

    <script>
      let win = 0;
      let lose = 0;
      let tie = 0;
    </script>
  </body>
</html>
