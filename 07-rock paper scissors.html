<!DOCTYPE html>
<html>
  <head>
    <title>Rock Paper Scissors</title>
    <style>
    .body {
      font-family:Arial
    }

    .rock, .paper, .scissors {
      height:130px;
      width:130px;
      border-radius:65px;
      border:1px solid grey;
      margin-right:10px;
      cursor:pointer;
    }

    .rock:active, .paper:active, .scissors:active{
      background-color: #e7e7e7;
    }
  </style>
  </head>
  
  <body class = "body">
    <p class="header">Rock Paper Scissors</p>
    <button class="rock" onclick="
      pickComputerMove();
      
      if (computerMove === 'Rock') {
        result = 'Tie'
        tie += 1;
      } else if (computerMove === 'Paper') {
        result = 'You lose'
        lose += 1;
      } else if (computerMove === 'Scissors') {
        result = 'You win'
        win += 1;
      }

      alert(`you picked paper, computer picked ${computerMove}, ${result}`)
    ">rock</button>

    <button class="paper" onclick="
      pickComputerMove();
      
      if (computerMove === 'Rock') {
        result = 'You win'
        win += 1;
      } else if (computerMove === 'Paper') {
        result = 'Tie'
        tie += 1;
      } else if (computerMove === 'Scissors') {
        result = 'You lose'
        lose += 1;
      }

      alert(`you picked paper, computer picked ${computerMove}, ${result}`)
    ">paper</button>

    <button class="scissors" onclick="
      pickComputerMove();
      

      if (computerMove === 'Rock') {
        result = 'You lose'
        lose += 1;
      } else if (computerMove === 'Paper') {
        result = 'You win'
        win += 1;
      } else if (computerMove === 'Scissors') {
        result = 'Tie'
        tie += 1;
      }

      alert(`you picked scissors, computer picked ${computerMove}, ${result}`)
    ">scissors</button>

    <button onclick="
      console.log('won: '+ win + '  ,lose: ' + lose + '  ,tie: ' + tie);
    ">check</button>

    <button onclick="
      win = 0;
      lose = 0;
      tie = 0;
      console.log('won: '+ win + '  ,lose: ' + lose + '  ,tie: ' + tie);
    ">reset</button>

    <script>
      let win = 0;
      let lose = 0;
      let tie = 0;

    
      let result = '';

      function pickComputerMove () {
        const randomNum2 = Math.random();
          let computerMove = '';

        if (randomNum2 >=0 && randomNum2 <= 1/3) {
          computerMove = 'Paper';
        } else if (randomNum2 >=1/3 && randomNum2 <= 2/3) {
          computerMove = 'Rock';
        } else {
          computerMove = 'Scissors';;
        }

        return computerMove;
      }
    </script>
  </body>
</html>
