<!DOCTYPE html>
<html>
  <head>
    <title>Rock Paper Scissors</title>
    <style>
    .body {
      font-family:Arial
    }

    .rock, .paper, .scissors {
      /*height:130px;
      width:130px;
      border-radius:65px;*/
      border:1px solid grey;
      margin-right:10px;
      cursor:pointer;
    }

    .rock:active, .paper:active, .scissors:active{
      background-color: #e7e7e7;
    }
  </style>
  </head>
  
  <body class = "body">
    <p class="header">Rock Paper Scissors</p>

    <button class="rock" onclick="
      playGame('rock');
    ">rock</button>

    <button class= "paper" onclick="
      playGame('paper');
    ">paper</button>

    <button class="scissors" onclick="
      playGame('scissors');
    ">scissors</button>

    <button onclick ="
      score.wins = 0;
      score.losses = 0;
      score.ties = 0;
      ">reset score</button>
 
    <script>
      let result = '';
      const score = {
        wins: 0,
        losses: 0,
        ties: 0
      }

      function pickComputerMove() {
        let computerMove = '';
        const randomNum = Math.random();

        if (randomNum >=0 && randomNum <= 1/3) {
          computerMove = 'Rock';
        } else if (randomNum >=1/3 && randomNum <= 2/3) {
          computerMove = 'Paper';
        } else if (randomNum >= 2/3 && randomNum < 1)  {
          computerMove = 'Scissors';
        }

        return computerMove;
      }

      function playGame (playerMove) { 

        const computerMove = pickComputerMove();
        let result = '';
        
        if (playerMove ==='scissors') {

          if (computerMove == 'Rock') {
            result = 'You lose';
          } else if (computerMove == 'Paper') {
            result = 'You win';
          } else if (computerMove == 'Scissors') {
            result = 'Tie';
          }

        } else if (playerMove === 'paper') {

          if (computerMove == 'Rock') {
            result = 'You win';
          } else if (computerMove == 'Paper') {
            result = 'Tie';
          } else if (computerMove == 'Scissors') {
            result = 'You lose';
          }

        } else if (playerMove === 'rock') {

          if (computerMove == 'Paper') {
            result = 'You lose';
          } else if (computerMove == 'Scissors') {
            result = 'You win';
          } else if (computerMove == 'Rock') {
            result = 'Tie';
          }
        }

        if (result === 'You win') {
          score.wins ++ ;
        } else if (result === 'You lose') {
          score.losses ++ ;
        } else if (result === 'Tie') {
          score.ties ++ ;
        }

        alert(`You picked ${playerMove}. Computer picked ${computerMove}, ${result}.\n` +
              `Wins: ${score.wins}, Losses: ${score.losses}, Ties: ${score.ties}`);

      }
    </script>
  </body>
</html>
