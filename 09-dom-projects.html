<!DOCTYPE html>
<html>
  <head>
    <title>DOM Projects</title>
    <style>
      .title {
        margin-top:50px;
      }

      p {
        font-family:Arial;
      }

      .subscribe-button {
        padding:9px 17px;
        background-color: #111111;
        color:white;
        font-family:Arial;
        font-style:bold;
        border-radius:20px;
        border: 1px solid grey;
        cursor:pointer;
      }
      
    </style>
  </head>
  <body>
    <p>Youtube Subscribe Button</p>
    <button onclick = "
      subscribe();
    " class="subscribe-button"> Subscribe</button>

    <p class="title">Amazon  Shipping Calculator</p>
    <p>Orders under &#36;40 = +&#36;10 shipping</p>
    <p>Orders over &#36;40 = free shipping</p>
    <input type="search" placeholder="Cost of order" />
    <button>Calculate</button>

    <p class="title">Rock Paper Scissors</p>
    <a href="google.com">Click here</a>

    <script>
      function subscribe() {
        const subscribeButton = document.querySelector('.subscribe-button');

        if (subscribeButton.innerText === 'Subscribe') {
          subscribeButton.innerHTML = 'Subscribed'
        } else {
          subscribeButton.innerHTML = 'Subscribe'
        }
      }
    </script>
  </body>
</html>
